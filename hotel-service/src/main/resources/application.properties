spring.application.name=hotel-service

server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/hotel_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# DEV: tự đồng bộ schema Hotel với entity hiện tại.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

app.jwt.secret=TakivivuAuthSecretKeyForJwtMustBeAtLeast32CharactersLong2026

service.inventory.internal-token=TAKIVIVU_INVENTORY_INTERNAL_2026

# Hotel image upload (development/local)
app.upload.hotel-image-dir=${HOTEL_IMAGE_UPLOAD_DIR:uploads/hotel-images}
