spring.application.name=map-service

server.port=8087

# Google Maps Platform API key - configure in IntelliJ/OS environment.
# Do not commit the real key to source control.
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# Current Google Maps Platform web-service endpoints.
google.maps.geocoding-url=https://maps.googleapis.com/maps/api/geocode/json
google.maps.places-search-url=https://places.googleapis.com/v1/places:searchText
google.maps.places-details-url=https://places.googleapis.com/v1/places
google.maps.routes-url=https://routes.googleapis.com/directions/v2:computeRoutes

google.maps.language=vi
google.maps.region=VN

# OpenStreetMap/Nominatim fallback for local development when GOOGLE_MAPS_API_KEY is empty/unavailable.
openstreetmap.nominatim-url=https://nominatim.openstreetmap.org/search
