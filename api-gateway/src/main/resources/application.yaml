server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: flight-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/flights/**

            - id: hotel-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/hotels/**

            - id: attraction-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/attractions/**

            - id: booking-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/bookings/**

            - id: payment-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/payments/**

            - id: map-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/maps/**

            - id: ai-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/ai/**

            - id: notification-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/notifications/**
            - id: promotion-service
              uri: http://localhost:8090
              predicates:
                - Path=/api/promotions/**

